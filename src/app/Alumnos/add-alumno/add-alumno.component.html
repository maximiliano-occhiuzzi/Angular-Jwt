<div class="container mt-4" style="max-width: 500px;">
  <h2>Alta de alumno</h2>

  <form [formGroup]="form" (ngSubmit)="guardar()">

    <div class="mb-3">
      <label class="form-label">Nombre</label>
      <input type="text" class="form-control" formControlName="nombre">
      <div class="text-danger" *ngIf="form.get('nombre')?.invalid && form.get('nombre')?.touched">
        El nombre es obligatorio.
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">Apellido</label>
      <input type="text" class="form-control" formControlName="apellido">
      <div class="text-danger" *ngIf="form.get('apellido')?.invalid && form.get('apellido')?.touched">
        El apellido es obligatorio.
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">DNI</label>
      <input type="text" class="form-control" formControlName="dni">
      <div class="text-danger" *ngIf="form.get('dni')?.invalid && form.get('dni')?.touched">
        El DNI es obligatorio.
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" class="form-control" formControlName="email">
      <div class="text-danger" *ngIf="form.get('email')?.invalid && form.get('email')?.touched">
        Ingresá un email válido.
      </div>
    </div>

    <div class="alert alert-danger" *ngIf="error">{{ error }}</div>

    <button type="submit" class="btn btn-primary" [disabled]="enviando">
      {{ enviando ? 'Guardando...' : 'Guardar' }}
    </button>
  </form>
</div>
