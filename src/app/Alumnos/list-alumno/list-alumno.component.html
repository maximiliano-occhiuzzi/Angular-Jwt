<div class="container mt-4">
  <div class="alert alert-primary">
    <strong>¡Hola, {{ username }}!</strong> {{ mensajeBienvenida }}
  </div>

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Listado de alumnos</h2>
    <button class="btn btn-outline-secondary btn-sm" (click)="cargar()">Refrescar</button>
  </div>

  <div class="alert alert-danger" *ngIf="error">{{ error }}</div>

  <p *ngIf="cargando">Cargando...</p>

  <table class="table table-striped" *ngIf="!cargando && alumnos.length">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Apellido</th>
        <th>DNI</th>
        <th>Email</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let a of alumnos">
        <td>{{ a.id }}</td>
        <td>{{ a.nombre }}</td>
        <td>{{ a.apellido }}</td>
        <td>{{ a.dni }}</td>
        <td>{{ a.email }}</td>
      </tr>
    </tbody>
  </table>

  <p *ngIf="!cargando && !alumnos.length && !error">No hay alumnos cargados todavía.</p>
</div>
