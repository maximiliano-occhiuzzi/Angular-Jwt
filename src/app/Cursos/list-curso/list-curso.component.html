<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Listado de cursos</h2>
    <button class="btn btn-outline-secondary btn-sm" (click)="cargar()">Refrescar</button>
  </div>

  <div class="alert alert-danger" *ngIf="error">{{ error }}</div>

  <p *ngIf="cargando">Cargando...</p>

  <table class="table table-striped" *ngIf="!cargando && cursos.length">
    <thead>
      <tr>
        <th>ID</th>
        <th>Ciclo lectivo</th>
        <th>Grado</th>
        <th>División</th>
        <th>Turno</th>
        <th>Cupo máximo</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let c of cursos">
        <td>{{ c.id }}</td>
        <td>{{ c.ciclo_lectivo }}</td>
        <td>{{ c.grado }}</td>
        <td>{{ c.division }}</td>
        <td>{{ c.turno }}</td>
        <td>{{ c.cupo_maximo }}</td>
      </tr>
    </tbody>
  </table>

  <p *ngIf="!cargando && !cursos.length && !error">No hay cursos cargados todavía.</p>
</div>
