<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Listado de personal</h2>
    <button class="btn btn-outline-secondary btn-sm" (click)="cargar()">Refrescar</button>
  </div>

  <div class="alert alert-danger" *ngIf="error">{{ error }}</div>

  <p *ngIf="cargando">Cargando...</p>

  <table class="table table-striped" *ngIf="!cargando && personal.length">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Apellido</th>
        <th>Email</th>
        <th>Cargo</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let p of personal">
        <td>{{ p.id }}</td>
        <td>{{ p.nombre }}</td>
        <td>{{ p.apellido }}</td>
        <td>{{ p.email }}</td>
        <td>{{ p.cargo }}</td>
      </tr>
    </tbody>
  </table>

  <p *ngIf="!cargando && !personal.length && !error">No hay personal cargado todavía.</p>
</div>
