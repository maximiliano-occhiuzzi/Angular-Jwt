<div class="container mt-5" style="max-width: 400px;">
  <h2 class="mb-4">Iniciar sesión</h2>

  <app-loading-overlay *ngIf="iniciandoSesion" mensaje="Iniciando sesión..."></app-loading-overlay>

  <form [formGroup]="form" (ngSubmit)="ingresar()">

    <div class="mb-3">
      <label class="form-label">Usuario</label>
      <input type="text" class="form-control" formControlName="username" autocomplete="username">
      <div class="text-danger" *ngIf="form.get('username')?.invalid && form.get('username')?.touched">
        El usuario es obligatorio.
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">Contraseña</label>
      <input type="password" class="form-control" formControlName="password" autocomplete="current-password">
      <div class="text-danger" *ngIf="form.get('password')?.invalid && form.get('password')?.touched">
        La contraseña es obligatoria.
      </div>
    </div>

    <div class="alert alert-danger" *ngIf="error">{{ error }}</div>

    <button type="submit" class="btn btn-primary w-100" [disabled]="enviando">
      {{ enviando ? 'Ingresando...' : 'Ingresar' }}
    </button>

    <p class="text-muted mt-3 small">
      Usuario de prueba: <strong>admin</strong> / <strong>admin123</strong>
    </p>
  </form>
</div>
