<div class="container mt-4" style="max-width: 450px;">
  <h2 class="mb-4">Registrar usuario</h2>

  <form [formGroup]="form" (ngSubmit)="registrar()">

    <div class="mb-3">
      <label class="form-label">Usuario</label>
      <input type="text" class="form-control" formControlName="username" autocomplete="off">
      <div class="text-danger" *ngIf="form.get('username')?.invalid && form.get('username')?.touched">
        El usuario es obligatorio.
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">Contraseña</label>
      <input type="password" class="form-control" formControlName="password" autocomplete="new-password">
      <div class="text-danger" *ngIf="form.get('password')?.invalid && form.get('password')?.touched">
        Mínimo 4 caracteres.
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">Rol</label>
      <select class="form-select" formControlName="rol">
        <option value="ALUMNO">ALUMNO</option>
        <option value="ADMIN">ADMIN</option>
      </select>
    </div>

    <div class="alert alert-danger" *ngIf="error">{{ error }}</div>
    <div class="alert alert-success" *ngIf="mensajeExito">{{ mensajeExito }}</div>

    <button type="submit" class="btn btn-primary" [disabled]="enviando">
      {{ enviando ? 'Creando...' : 'Crear usuario' }}
    </button>
  </form>
</div>
